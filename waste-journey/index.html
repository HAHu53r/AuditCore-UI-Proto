<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AuditCore · Waste Journey prototype</title>
<style>
:root{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;color:#1a202c;background:#f6f8fa}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}header{background:linear-gradient(90deg,#8ca0ff,#3744aa);color:white;padding:15px max(18px,calc((100vw - 1450px)/2));display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;font-size:19px}small,.muted{color:#718096;font-size:12px}header small{color:#edf0ff}nav{max-width:1450px;margin:auto;display:flex;gap:8px;flex-wrap:wrap;padding:15px 15px 0}button{border-radius:8px;border:1px solid #d8dfeb;background:white;padding:10px 13px;color:#344054;font-weight:650}button.active{color:#3744aa;background:#e9edff;border-color:#9eafff}.primary{background:#667eea;color:white;border-color:#667eea}.workspace{margin:16px auto 35px;padding:0 15px;max-width:1440px}.workspace.capture{max-width:420px}.workspace.review{max-width:1100px}.panel{background:white;border:1px solid #dee2e6;border-radius:12px;padding:15px;margin-bottom:12px}h1{font-size:23px;letter-spacing:-.4px;margin:0 0 5px}h2{font-size:16px;margin:0 0 10px}p{line-height:1.5;color:#64748b;margin:3px 0 12px}.row{display:flex;align-items:center;gap:9px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}.label{display:block;font-size:12px;font-weight:650;margin:14px 0 5px}input,select,textarea{border:1px solid #ced6e2;border-radius:8px;padding:11px;background:white;max-width:100%}textarea{width:100%;min-height:84px}.wide{width:100%}.camera{border:2px dashed #b9c5f2;background:#f2f4ff;border-radius:10px;display:block;text-align:center;padding:23px;cursor:pointer}.camera img{max-width:100%;max-height:190px;border-radius:8px}.bottom{position:sticky;bottom:0;background:white;border-top:1px solid #dce1ea;padding:12px;margin:12px -15px -15px}.micro{color:#718096;font-size:11px}.badge{background:#edf2ff;color:#4f5eb8;padding:4px 7px;border-radius:18px;font-size:11px;white-space:nowrap}.green{background:#e3f5ea;color:#166534}.warn{background:#fff1d4;color:#98600d}.photo-count{display:inline-flex;gap:4px;align-items:center;color:#3744aa;font-weight:650;font-size:11px}.photo-count svg{width:16px;height:16px}.item{display:flex;gap:10px;align-items:center;padding:9px;border-bottom:1px solid #eef0f4;cursor:pointer}.item:last-child{border:0}.thumb{width:45px;height:42px;object-fit:cover;border-radius:7px;background:#e3e8f2}.item-title{font-size:13px;font-weight:650;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.item-sub{color:#738096;font-size:11px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:15px 0}.stat{background:white;border:1px solid #dce2ea;border-radius:10px;padding:12px}.stat strong{display:block;font-size:25px;color:#5668d3}.stat span{color:#718096;font-size:11px}.board{display:flex;gap:11px;overflow-x:auto;padding:4px 0 14px}.lane{background:#eaf0f7;border:1px solid #dce2ea;border-radius:10px;min-width:205px;width:205px;padding:9px;min-height:260px}.lane.hover{outline:2px dashed #667eea}.lane-head{font-weight:750;font-size:12px;display:flex;justify-content:space-between;padding:4px 2px 10px}.sticky{border-radius:4px 12px 11px 11px;background:#fff3bc;padding:10px;margin:8px 0;box-shadow:2px 3px 3px #00000010;cursor:grab}.sticky:nth-child(3n){background:#dff2ff}.sticky img{width:100%;height:85px;object-fit:cover;border-radius:6px;margin:6px 0}.sticky-title{font-weight:750;font-size:12px;margin:7px 0}.area-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.area{padding:14px;border-radius:10px;border:1px solid #dee2e6;background:white}.hint{padding:10px;background:#eef2ff;border-radius:8px;color:#3744aa;font-size:12px;margin:9px 0}.desktop-note{font-size:12px;color:#64748b}.overlay{position:fixed;inset:0;background:#1720339a;z-index:10;display:flex;align-items:center;justify-content:center;padding:13px}.dialog{background:white;width:min(480px,100%);max-height:90vh;overflow:auto;padding:19px;border-radius:12px}.dialog input,.dialog select{width:100%}.dialog button{margin-top:8px}.locked{display:none}.notice{color:#176338;font-size:12px;margin:10px 0}footer{text-align:center;font-size:11px;color:#718096;padding:20px}
@media(max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}.area-grid{grid-template-columns:1fr}nav{gap:5px}nav button{padding:9px;font-size:12px}.desktop{display:none}.workspace{margin-top:10px}.workspace.capture{max-width:none}.desktop-gate{display:block!important}}@media(min-width:641px){.desktop-gate{display:none!important}}
</style></head><body>
<header><div><div class="brand">◈ AuditCore</div><small>Lean management platform</small></div><div style="text-align:right;font-size:13px">Waste Journey<br><small>Public UX prototype · Epic #240</small></div></header>
<nav id="navigation"><button data-page="capture" class="active">📷 New Observation</button><button data-page="review">☑ Review</button><button data-page="board">▦ Whiteboard · Desktop only</button><button data-page="areas">⌖ Areas & Standards · Desktop only</button></nav>
<main id="workspace" class="workspace capture"></main><div id="dialog"></div>
<footer>Interactive concept · Sample observations and illustrative photos · No backend connection, account or real task creation</footer>
<script>
(()=>{'use strict';
const workspace=document.getElementById('workspace'),dlg=document.getElementById('dialog');
const categories=['Unclassified','Waiting','Transport','Motion','Inventory','Defects','Overproduction','Overprocessing','Unused talent'];
const photos=['https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?w=480&q=70','https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?w=480&q=70','https://images.unsplash.com/photo-1565793298595-6ba8978b2826?w=480&q=70','https://images.unsplash.com/photo-1504917595217-d4dc5ebe6122?w=480&q=70'];
let areas=[{id:1,name:'Packing',standard:'yes'},{id:2,name:'Warehouse',standard:'no'},{id:3,name:'Assembly',standard:'yes'},{id:4,name:'Cutting line',standard:'review'}];
const seed=[['Pallets blocking pedestrian aisle','Waiting',2,0,2],['Tools outside marked positions','Motion',3,1,1],['Unlabelled material containers','Inventory',2,0,2],['Packaging waste on floor','Defects',1,2,1],['Excess finished goods stock','Inventory',1,0,1],['Unnecessary walking to collect tools','Motion',3,1,1],['Damaged pallet near dispatch','Defects',2,2,2],['Material flow stops at transfer point','Waiting',null,3,1],['Extra handling between stations','Transport',4,1,1],['Duplicate manual inspection step','Overprocessing',4,3,0]];
let notes=seed.map((v,i)=>({id:i+1,title:v[0],cat:v[1],area:v[2],img:v[3],photos:v[4],tasks:0,draft:false}));let page='capture',nextId=11,upload=null,drag=null;
const E=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
const B=(t,a,c='')=>'<button type="button" class="'+c+'" data-act="'+a+'">'+t+'</button>';
const A=id=>areas.find(a=>a.id===id),areaName=id=>A(id)?.name||'Unassigned';
const photoBadge=n=>n.photos?'<span class="photo-count" title="'+n.photos+' attached photos"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M2 2h12v12H2zm1.5 1.5v9h9v-9h-9z"/><circle cx="6" cy="6" r="1.4"/><path d="m4 11 3-3 2 2 2-2 2 3z"/></svg>'+n.photos+'</span>':'';
const areaOptions=id=>'<option value="">Unassigned</option>'+areas.map(a=>'<option value="'+a.id+'" '+(id===a.id?'selected':'')+'>'+E(a.name)+'</option>').join('');
const catOptions=v=>categories.map(c=>'<option '+(v===c?'selected':'')+'>'+E(c)+'</option>').join('');
const img=n=>n.imageData||photos[n.img%photos.length];
const stat=(num,name)=>'<div class="stat"><strong>'+num+'</strong><span>'+name+'</span></div>';
function noteRow(n){return '<div class="item" data-act="edit:'+n.id+'"><img class="thumb" src="'+E(img(n))+'" alt="Sample observation" onerror="this.style.opacity=.15"><div class="grow"><div class="item-title">'+E(n.title)+'</div><div class="item-sub">'+E(areaName(n.area))+' · '+E(n.cat)+'</div></div>'+photoBadge(n)+(n.tasks?'<span class="badge green">Task</span>':'')+(n.draft?'<span class="badge">Draft</span>':'')+'</div>'}
function capture(){workspace.innerHTML='<div class="panel"><div class="row between"><div><h1>New Observation</h1><p>Capture first. Structure later.</p></div><span class="badge green">● Active</span></div><label class="camera" for="photoInput" id="photoPlaceholder">'+(upload?'<img src="'+E(upload)+'" alt="Selected photo">':'<div style="font-size:35px">📷</div><b>Take or choose photo</b><p>Camera or photo library</p>')+'</label><input id="photoInput" type="file" accept="image/*" capture="environment" hidden><label class="label">Note · optional</label><textarea id="newNote" placeholder="What did you notice?"></textarea><label class="label">Area · optional</label><select id="newArea" class="wide">'+areaOptions(null)+'</select><div class="hint">You can capture without area, category, severity or corrective action.</div><div class="bottom">'+B('＋ Save & next observation','save','primary wide')+'</div></div><div class="panel"><div class="row between"><b>Recent observations</b><span class="muted">'+notes.length+' captured</span></div>'+notes.slice(0,3).map(noteRow).join('')+'</div>'}
function review(){workspace.innerHTML='<div class="row between"><div><h1>Review observations</h1><p>Compact list. Open any row to classify, assign or act.</p></div><span class="badge">'+notes.length+' items</span></div><div class="panel" style="padding:4px 10px">'+notes.map(noteRow).join('')+'</div>'}
function stats(){return '<div class="stats">'+stat(notes.length,'Observations')+stat(notes.filter(n=>!n.area).length,'Unassigned')+stat(notes.filter(n=>n.area&&A(n.area)?.standard==='no').length,'Without standard')+stat(notes.filter(n=>n.tasks).length,'With tasks')+'</div>'}
function board(){workspace.innerHTML='<div class="desktop"><div class="row between"><div><h1>Waste Discovery Whiteboard</h1><p>Drag post-it notes across Lean waste categories.</p></div><span class="badge">Desktop only</span></div>'+stats()+'<div class="board">'+categories.map(c=>'<div class="lane" data-lane="'+E(c)+'"><div class="lane-head">'+E(c)+'<span>'+notes.filter(n=>n.cat===c).length+'</span></div>'+notes.filter(n=>n.cat===c).map(n=>'<div class="sticky" draggable="true" data-id="'+n.id+'"><div class="row between"><small>#'+n.id+'</small>'+photoBadge(n)+'</div><div class="sticky-title">'+E(n.title)+'</div>'+(n.photos?'<img src="'+E(img(n))+'" alt="Illustrative photo" onerror="this.style.display=\'none\'">':'')+'<div class="micro">⌖ '+E(areaName(n.area))+'</div>'+B('Edit / assign','edit:'+n.id)+'</div>').join('')+'</div>').join('')+'</div></div><div class="desktop-gate panel" style="display:none"><h2>Desktop only</h2><p>Open this view on a computer. Capture and Review remain available on mobile.</p>'+B('New Observation','capture','primary')+'</div>'}
function areasPage(){workspace.innerHTML='<div class="desktop"><div class="row between"><div><h1>Areas & Standards</h1><p>Map observations and see existing or missing standard coverage.</p></div>'+B('＋ Define area','newarea','primary')+'</div>'+stats()+'<div class="area-grid">'+areas.map(a=>{let ns=notes.filter(n=>n.area===a.id);let rec=a.standard==='no'&&ns.length>=2?'Consider drafting a new standard from reviewed observations.':a.standard==='review'?'Review the existing standard.':'Review recurring observations for possible improvements.';return '<div class="area"><div class="row between"><b>'+E(a.name)+'</b><span class="badge '+(a.standard==='no'?'warn':a.standard==='yes'?'green':'')+'">'+E(a.standard==='yes'?'Standard exists':a.standard==='no'?'No standard':'Needs review')+'</span></div><p>'+ns.length+' observations</p><div class="hint">'+E(rec)+'</div>'+B('Edit area','area:'+a.id)+'</div>'}).join('')+'</div></div><div class="desktop-gate panel" style="display:none"><h2>Desktop only</h2><p>Use a larger screen to manage areas and standards.</p>'+B('New Observation','capture','primary')+'</div>'}
function draw(){workspace.className='workspace '+page;document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===page));({capture,review,board,areas:areasPage})[page]()}
function edit(id){let n=notes.find(n=>n.id===id);if(!n)return;dlg.innerHTML='<div class="overlay"><div class="dialog"><div class="row between"><h2>Observation #'+n.id+'</h2>'+B('✕','close')+'</div><label class="label">Description</label><textarea id="etitle">'+E(n.title)+'</textarea><label class="label">Waste category</label><select id="ecat">'+catOptions(n.cat)+'</select><label class="label">Area</label><select id="earea">'+areaOptions(n.area)+'</select><p class="hint">Tasks represent corrective actions; creating one does not mean the issue is resolved. Draft standards require a real target area.</p><div class="row wrap">'+B('＋ Task (demo)','task:'+id)+B(n.draft?'Draft already linked':'＋ Standard draft','draft:'+id)+'</div><div class="row between" style="margin-top:12px">'+B('Cancel','close')+B('Save changes','saveedit:'+id,'primary')+'</div></div></div>'}
function areaEdit(id){const a=A(id);if(!a)return;dlg.innerHTML='<div class="overlay"><div class="dialog"><div class="row between"><h2>Edit area</h2>'+B('✕','close')+'</div><label class="label">Area</label><input id="aname" value="'+E(a.name)+'"><label class="label">Standard coverage (demo)</label><select id="astatus"><option value="yes" '+(a.standard==='yes'?'selected':'')+'>Standard exists</option><option value="no" '+(a.standard==='no'?'selected':'')+'>No standard</option><option value="review" '+(a.standard==='review'?'selected':'')+'>Needs review</option></select>'+B('Save area','savearea:'+id,'primary wide')+'</div></div>'}
document.addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b){page=b.dataset.page;draw();return}b=e.target.closest('[data-act]');if(!b)return;let [act,raw]=b.dataset.act.split(':'),id=Number(raw),n=notes.find(x=>x.id===id);
if(['capture','review','board','areas'].includes(act)){page=act;draw();return}
if(act==='close'){dlg.innerHTML='';return}
if(act==='edit'){edit(id);return}
if(act==='area'){areaEdit(id);return}
if(act==='save'){const title=document.getElementById('newNote').value.trim()||'New observation',ar=document.getElementById('newArea').value;notes.unshift({id:nextId++,title,area:ar?Number(ar):null,cat:'Unclassified',photos:upload?1:0,imageData:upload,img:0,tasks:0,draft:false});upload=null;draw();document.getElementById('newNote')?.focus();return}
if(act==='task'&&n){n.tasks++;dlg.innerHTML='';draw();return}
if(act==='draft'&&n){const ar=document.getElementById('earea').value;if(!ar){alert('Select a real target area before creating a draft.');return}n.area=Number(ar);n.draft=true;dlg.innerHTML='';draw();return}
if(act==='saveedit'&&n){n.title=document.getElementById('etitle').value.trim()||n.title;n.cat=document.getElementById('ecat').value;const a=document.getElementById('earea').value;n.area=a?Number(a):null;dlg.innerHTML='';draw();return}
if(act==='savearea'){const a=A(id);a.name=document.getElementById('aname').value.trim()||a.name;a.standard=document.getElementById('astatus').value;dlg.innerHTML='';draw();return}
if(act==='newarea'){dlg.innerHTML='<div class="overlay"><div class="dialog"><h2>Define area</h2><label class="label">Area name</label><input id="newAreaName" placeholder="e.g. Line 2 buffer">'+B('Create area','createarea','primary wide')+'</div></div>';return}
if(act==='createarea'){const v=document.getElementById('newAreaName').value.trim();if(!v)return;areas.push({id:Math.max(...areas.map(x=>x.id))+1,name:v,standard:'no'});dlg.innerHTML='';draw();return}
});
document.addEventListener('change',e=>{if(e.target.id==='photoInput'){const f=e.target.files?.[0];if(f){const note=document.getElementById('newNote')?.value||'',ar=document.getElementById('newArea')?.value||'';const rd=new FileReader();rd.onload=()=>{upload=String(rd.result);draw();document.getElementById('newNote').value=note;document.getElementById('newArea').value=ar};rd.readAsDataURL(f)}}});
document.addEventListener('dragstart',e=>{const s=e.target.closest('[data-id]');if(!s)return;drag=Number(s.dataset.id);e.dataTransfer?.setData('text/plain',String(drag))});
document.addEventListener('dragover',e=>{const lane=e.target.closest('[data-lane]');if(lane){e.preventDefault();lane.classList.add('hover')}});
document.addEventListener('dragleave',e=>{const lane=e.target.closest('[data-lane]');if(lane)lane.classList.remove('hover')});
document.addEventListener('drop',e=>{const lane=e.target.closest('[data-lane]');if(!lane)return;e.preventDefault();let n=notes.find(x=>x.id===drag);if(n)n.cat=lane.dataset.lane;drag=null;draw()});
document.addEventListener('dragend',()=>{drag=null;document.querySelectorAll('.lane').forEach(x=>x.classList.remove('hover'))});
draw();
})();
</script></body></html>

let cameraStream=null;
function stopCamera(){if(cameraStream){cameraStream.getTracks().forEach(track=>track.stop());cameraStream=null}dlg.querySelector('video')?.pause()}
async function openCamera(){
 if(!navigator.mediaDevices?.getUserMedia){alert('Live camera is not supported here. Please use Choose photo instead.');return}
 dlg.innerHTML='<div class="overlay"><div class="dialog"><div class="row between"><h2>Take photo</h2>'+B('✕','closeCamera')+'</div><video id="liveCamera" autoplay playsinline muted style="width:100%;max-height:60vh;background:#111;border-radius:10px"></video><p class="muted">Allow camera access in the browser when prompted.</p><div class="row wrap">'+B('Capture photo','snapCamera','primary')+B('Cancel','closeCamera')+'</div></div></div>';
 try{const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});cameraStream=stream;const v=dlg.querySelector('#liveCamera');if(!v){stopCamera();return}v.srcObject=stream;await v.play().catch(()=>{});}
 catch(err){stopCamera();dlg.innerHTML='';alert('Camera could not be opened. Check permission or use Choose photo.')}
}
function snapCamera(){const v=dlg.querySelector('#liveCamera');if(!v||!v.videoWidth){alert('Camera is not ready yet.');return}const canvas=document.createElement('canvas');const ratio=Math.min(1,1600/v.videoWidth);canvas.width=Math.round(v.videoWidth*ratio);canvas.height=Math.round(v.videoHeight*ratio);canvas.getContext('2d').drawImage(v,0,0,canvas.width,canvas.height);upload=canvas.toDataURL('image/jpeg',.82);stopCamera();dlg.innerHTML='';const note=document.getElementById('newNote')?.value||'',ar=document.getElementById('newArea')?.value||'';draw();document.getElementById('newNote').value=note;document.getElementById('newArea').value=ar}
const E=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
const B=(t,a,c='')=>'<button type="button" class="'+c+'" data-act="'+a+'">'+t+'</button>';
const A=id=>areas.find(a=>a.id===id),areaName=id=>A(id)?.name||'Unassigned';
const photoBadge=n=>n.photos?'<span class="photo-count" title="'+n.photos+' attached photos"><i class="bi bi-images" aria-hidden="true"></i>'+n.photos+'</span>':'';
const areaOptions=id=>'<option value="">Unassigned</option>'+areas.map(a=>'<option value="'+a.id+'" '+(id===a.id?'selected':'')+'>'+E(a.name)+'</option>').join('');
const catOptions=v=>categories.map(c=>'<option '+(v===c?'selected':'')+'>'+E(c)+'</option>').join('');
const img=n=>n.photos>0?(n.imageData||(Number.isInteger(n.img)?photos[n.img%photos.length]:null)):null;
const stat=(num,name)=>'<div class="stat"><strong>'+num+'</strong><span>'+name+'</span></div>';
function noteRow(n){return '<div class="item" data-act="edit:'+n.id+'">'+(img(n)?'<img class="thumb" src="'+E(img(n))+'" alt="Observation photo" onerror="this.style.opacity=.15">':'<span class="thumb no-photo" aria-label="No photo attached"><i class="bi bi-image" aria-hidden="true"></i></span>')+'<div class="grow"><div class="item-title">'+E(n.title)+'</div><div class="item-sub">'+E(areaName(n.area))+' · '+E(n.cat)+'</div></div>'+photoBadge(n)+(n.tasks?'<span class="badge green">Task</span>':'')+(n.draft?'<span class="badge">Draft</span>':'')+'</div>'}
function capture(){workspace.innerHTML='<div class="panel"><div class="row between"><div><h1>New Observation</h1><p>Capture first. Structure later.</p></div><span class="badge green">● Active</span></div><div class="camera" id="photoPlaceholder">'+(upload?'<img src="'+E(upload)+'" alt="Selected photo">':'<div style="font-size:35px">📷</div><b>Add observation photo</b>')+'</div><div class="row wrap" style="margin-top:9px">'+B('<i class="bi bi-camera" aria-hidden="true"></i> Open camera','openCamera','primary')+'<label for="photoInput" class="photo-picker"><i class="bi bi-images" aria-hidden="true"></i> Choose photo</label></div><input id="photoInput" type="file" accept="image/*" hidden><label class="label">Note · optional</label><textarea id="newNote" placeholder="What did you notice?"></textarea><label class="label">Area · optional</label><select id="newArea" class="wide">'+areaOptions(null)+'</select><div class="bottom">'+B('＋ Save & next observation','save','primary wide')+'</div></div><div class="panel"><div class="row between"><b>Recent observations</b><span class="muted">'+notes.length+' captured</span></div>'+notes.slice(0,3).map(noteRow).join('')+'</div>'}
function review(){workspace.innerHTML='<div class="row between"><div><h1>Review observations</h1><p>Compact list. Open any row to classify, assign or act.</p></div><span class="badge">'+notes.length+' items</span></div><div class="panel" style="padding:4px 10px">'+notes.map(noteRow).join('')+'</div>'}
function stats(){return '<div class="stats">'+stat(notes.length,'Observations')+stat(notes.filter(n=>!n.area).length,'Unassigned')+stat(notes.filter(n=>n.area&&A(n.area)?.standard==='no').length,'Without standard')+stat(notes.filter(n=>n.tasks).length,'With tasks')+'</div>'}
const boardGroups=[
{name:'Unclassified',icon:'bi-question-circle',detail:'Needs classification',types:['Unclassified'],defaultCat:'Unclassified'},
{name:'Transport',icon:'bi-truck',detail:'Moving materials',types:['Transport'],defaultCat:'Transport'},
{name:'Inventory',icon:'bi-box-seam',detail:'Excess stock',types:['Inventory'],defaultCat:'Inventory'},
{name:'Motion',icon:'bi-person-walking',detail:'Unnecessary movement',types:['Motion'],defaultCat:'Motion'},
{name:'Waiting',icon:'bi-hourglass-split',detail:'Idle time and delays',types:['Waiting'],defaultCat:'Waiting'},
{name:'Overproduction',icon:'bi-boxes',detail:'Making too much',types:['Overproduction'],defaultCat:'Overproduction'},
{name:'Overprocessing',icon:'bi-arrow-repeat',detail:'Unnecessary work',types:['Overprocessing'],defaultCat:'Overprocessing'},
{name:'Defects',icon:'bi-exclamation-triangle',detail:'Errors and rework',types:['Defects'],defaultCat:'Defects'},
{name:'Unused talent',icon:'bi-people',detail:'Unused skills and ideas',types:['Unused talent'],defaultCat:'Unused talent'}
];
function board(){workspace.innerHTML='<div class="desktop"><div class="row between"><div><h1>Waste Discovery Whiteboard</h1><p>Eight Lean wastes, plus Unclassified. Drag to classify or open a card to edit.</p></div><span class="badge">Desktop only</span></div>'+stats()+'<div class="board lean-layout"><div class="lean-categories">'+boardGroups.map((g,i)=>'<div class="lane lean-lane lean-lane-'+i+'" data-group="'+i+'" style="--lane-accent:'+(['#64748b','#2563eb','#0d9488','#7c3aed','#d97706','#db2777','#64748b','#dc3545','#198754'][i])+';--lane-tint:'+(['#f1f5f9','#eff6ff','#f0fdfa','#f5f3ff','#fffbeb','#fdf2f8','#f8fafc','#fef2f2','#f0fdf4'][i])+'"><div class="lane-head"><span><i class="bi '+g.icon+'" aria-hidden="true"></i> '+E(g.name)+'</span><span>'+notes.filter(n=>g.types.includes(n.cat)).length+'</span></div><div class="micro" style="margin:-5px 2px 10px">'+E(g.detail)+'</div>'+notes.filter(n=>g.types.includes(n.cat)).map(n=>'<div class="sticky" draggable="true" data-id="'+n.id+'"><div class="row between"><small>#'+n.id+'</small>'+photoBadge(n)+'</div><div class="sticky-title">'+E(n.title)+'</div>'+(img(n)?'<img src="'+E(img(n))+'" alt="Observation photo" onerror="this.style.display=\'none\'">':'')+'<div class="micro">'+E(n.cat)+' · ⌖ '+E(areaName(n.area))+'</div>'+'<button type="button" class="sticky-edit" data-act="edit:'+n.id+'" title="Edit observation #'+n.id+'" aria-label="Edit observation #'+n.id+'"><i class="bi bi-pencil-square" aria-hidden="true"></i></button>'+'</div>').join('')+'</div>').join('')+'</div><p class="desktop-note">Drag across groups to move an observation. Dropping a card in another category updates its classification. Use the pencil to edit the observation.</p></div><div class="desktop-gate panel" style="display:none"><h2>Desktop only</h2><p>Open this view on a computer. Capture and Review remain available on mobile.</p>'+B('New Observation','capture','primary')+'</div>'}
function standardRow(n){const decision=n.standardDecision||'Not reviewed';return '<div class="standard-row">'+(img(n)?'<img class="standard-photo" src="'+E(img(n))+'" alt="Observation photo" onerror="this.style.opacity=.2">':'<span class="standard-photo no-photo" aria-label="No photo attached"><i class="bi bi-image" aria-hidden="true"></i></span>')+'<div class="standard-main"><b>#'+n.id+' '+E(n.title)+'</b><div class="micro">'+E(n.cat)+' · '+(n.photos?photoBadge(n):'No photo')+'</div><div class="standard-badges"><span class="badge '+(decision==='Not reviewed'?'warn':decision==='Standard adequate'?'green':'')+'">'+E(decision)+'</span>'+(n.tasks?'<span class="badge green">Task added</span>':'')+(n.draft?'<span class="badge green">Draft linked</span>':'')+'</div></div><div class="standard-actions">'+B('Review decision','standard:'+n.id)+B('Edit','edit:'+n.id)+'</div></div>'}
function areasPage(){const assigned=notes.filter(n=>n.area);const pending=assigned.filter(n=>!n.standardDecision||n.standardDecision==='Not reviewed').length;const gaps=assigned.filter(n=>['Missing standard','Improve standard','Not followed'].includes(n.standardDecision)).length;const uncovered=notes.filter(n=>!n.area);workspace.innerHTML='<div class="desktop"><div class="row between"><div><h1>Standardize · From observation to action</h1><p>Review findings assigned to each area. Decide whether existing work standards need action, and connect findings to follow-up tasks or draft standards.</p></div>'+B('＋ Define area','newarea','primary')+'</div><div class="standard-summary"><div class="stat"><strong>'+assigned.length+'</strong><span>Assigned observations</span></div><div class="stat"><strong>'+pending+'</strong><span>Awaiting decision</span></div><div class="stat"><strong>'+gaps+'</strong><span>Standard gaps / noncompliance</span></div><div class="stat"><strong>'+notes.filter(n=>n.draft).length+'</strong><span>Drafts linked (demo)</span></div></div><div class="standard-area-list">'+areas.map(a=>{const ns=assigned.filter(n=>n.area===a.id);return '<section class="panel standard-section"><div class="row between standard-heading"><div><h2>'+E(a.name)+'</h2><span class="micro">'+ns.length+' assigned observation'+(ns.length===1?'':'s')+'</span></div><div class="row wrap"><span class="badge '+(a.standard==='no'?'warn':a.standard==='yes'?'green':'')+'">'+E(a.standard==='yes'?'Area standard exists':a.standard==='no'?'No area standard':'Area standard needs review')+'</span>'+B('Edit area','area:'+a.id)+'</div></div>'+(ns.length?ns.map(standardRow).join(''):'<p class="standard-empty">No observations assigned to this area. Assign them in Review to assess standard coverage.</p>')+'</section>'}).join('')+'</div><section class="panel"><div class="row between"><h2>Unassigned observations</h2><span class="badge warn">'+uncovered.length+'</span></div><p>These findings have not been linked to an area, so the relevant workplace standard cannot yet be assessed.</p>'+(uncovered.length?uncovered.map(standardRow).join(''):'<p class="standard-empty">All observations have been assigned.</p>')+'</section><p class="desktop-note">Prototype only: decisions, tasks and draft markers are local demo state. AuditCore Tasks and Standards are not yet connected.</p></div><div class="desktop-gate panel" style="display:none"><h2>Desktop only</h2><p>Use a larger screen to manage areas and standards.</p>'+B('New Observation','capture','primary')+'</div>'}
function standardDecision(id){const n=notes.find(x=>x.id===id);if(!n)return;const opts=['Not reviewed','Standard adequate','Missing standard','Improve standard','Not followed','Needs further investigation'];dlg.innerHTML='<div class="overlay"><div class="dialog"><div class="row between"><h2>Standard review · #'+n.id+'</h2>'+B('✕','close')+'</div><p><b>'+E(n.title)+'</b></p><p>Area: '+E(areaName(n.area))+'</p><label class="label">What did the observation reveal?</label><select id="standardDecisionSelect">'+opts.map(v=>'<option '+((n.standardDecision||'Not reviewed')===v?'selected':'')+'>'+E(v)+'</option>').join('')+'</select><div class="hint">Choose whether to create a corrective task, improve a standard, or keep investigating. This records a decision; it does not publish a standard or resolve the observation.</div><div class="row wrap">'+B('Save decision','saveStandard:'+n.id,'primary')+B('Open observation','edit:'+n.id)+'</div></div></div>'}
function draw(){workspace.className='workspace '+page;document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===page));({capture,review,board,areas:areasPage})[page]();if(page==='capture'||page==='review'){workspace.insertAdjacentHTML('beforeend','<nav class="device-nav" aria-label="Mobile workflow navigation"><button type="button" data-page="capture" class="'+(page==='capture'?'selected':'')+'"><i class="bi bi-camera" aria-hidden="true"></i> Capture</button><button type="button" data-page="review" class="'+(page==='review'?'selected':'')+'"><i class="bi bi-clipboard-check" aria-hidden="true"></i> Review</button></nav>')}}
function edit(id){let n=notes.find(n=>n.id===id);if(!n)return;const media=n.photos?'<div class="observation-media"><div class="row between"><b>Photos</b>'+photoBadge(n)+'</div><button type="button" class="media-preview" data-act="zoom:'+id+'" aria-label="View observation photo larger"><img src="'+E(img(n))+'" alt="Photo attached to observation #'+n.id+'" onerror="this.style.display=\'none\';this.parentElement.insertAdjacentHTML(\'beforeend\',\'<span class=media-error>Photo unavailable</span>\')"></button>'+(n.photos>1?'<p class="micro">Sample data indicates '+n.photos+' photos; only one illustrative image is available in this prototype.</p>':'')+'</div>':'';dlg.innerHTML='<div class="overlay"><div class="dialog"><div class="row between"><h2>Observation #'+n.id+'</h2>'+B('✕','close')+'</div>'+media+'<label class="label">Description</label><textarea id="etitle">'+E(n.title)+'</textarea><label class="label">Waste category</label><select id="ecat">'+catOptions(n.cat)+'</select><label class="label">Area</label><select id="earea">'+areaOptions(n.area)+'</select><p class="hint">Tasks represent corrective actions; creating one does not mean the issue is resolved. Draft standards require a real target area.</p><div class="row wrap">'+B('＋ Task (demo)','task:'+id)+B(n.draft?'Draft already linked':'＋ Standard draft','draft:'+id)+'</div><div class="row between" style="margin-top:12px">'+B('Cancel','close')+B('Save changes','saveedit:'+id,'primary')+'</div></div></div>'}
function areaEdit(id){const a=A(id);if(!a)return;dlg.innerHTML='<div class="overlay"><div class="dialog"><div class="row between"><h2>Edit area</h2>'+B('✕','close')+'</div><label class="label">Area</label><input id="aname" value="'+E(a.name)+'"><label class="label">Standard coverage (demo)</label><select id="astatus"><option value="yes" '+(a.standard==='yes'?'selected':'')+'>Standard exists</option><option value="no" '+(a.standard==='no'?'selected':'')+'>No standard</option><option value="review" '+(a.standard==='review'?'selected':'')+'>Needs review</option></select>'+B('Save area','savearea:'+id,'primary wide')+'</div></div>'}
document.addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b){stopCamera();page=b.dataset.page;draw();window.scrollTo({top:0,behavior:'auto'});return}b=e.target.closest('[data-act]');if(!b)return;let [act,raw]=b.dataset.act.split(':'),id=Number(raw),n=notes.find(x=>x.id===id);
if(['capture','review','board','areas'].includes(act)){stopCamera();page=act;draw();return}
if(act==='openCamera'){openCamera();return}
if(act==='snapCamera'){snapCamera();return}
if(act==='closeCamera'){stopCamera();dlg.innerHTML='';return}
if(act==='close'){stopCamera();dlg.innerHTML='';return}
if(act==='edit'){edit(id);return}
if(act==='zoom'&&n){const image=img(n);window.open(image,'_blank','noopener,noreferrer');return}
if(act==='standard'){standardDecision(id);return}
if(act==='saveStandard'&&n){n.standardDecision=document.getElementById('standardDecisionSelect').value;dlg.innerHTML='';draw();return}
if(act==='area'){areaEdit(id);return}
if(act==='save'){const title=document.getElementById('newNote').value.trim()||'New observation',ar=document.getElementById('newArea').value;notes.unshift({id:nextId++,title,area:ar?Number(ar):null,cat:'Unclassified',photos:upload?1:0,imageData:upload,img:null,tasks:0,draft:false});upload=null;draw();document.getElementById('newNote')?.focus();return}
if(act==='task'&&n){n.tasks++;dlg.innerHTML='';draw();return}
if(act==='draft'&&n){const ar=document.getElementById('earea').value;if(!ar){alert('Select a real target area before creating a draft.');return}n.area=Number(ar);n.draft=true;dlg.innerHTML='';draw();return}
if(act==='saveedit'&&n){n.title=document.getElementById('etitle').value.trim()||n.title;n.cat=document.getElementById('ecat').value;const a=document.getElementById('earea').value;n.area=a?Number(a):null;dlg.innerHTML='';draw();return}
if(act==='savearea'){const a=A(id);a.name=document.getElementById('aname').value.trim()||a.name;a.standard=document.getElementById('astatus').value;dlg.innerHTML='';draw();return}
if(act==='newarea'){dlg.innerHTML='<div class="overlay"><div class="dialog"><h2>Define area</h2><label class="label">Area name</label><input id="newAreaName" placeholder="e.g. Line 2 buffer">'+B('Create area','createarea','primary wide')+'</div></div>';return}
if(act==='createarea'){const v=document.getElementById('newAreaName').value.trim();if(!v)return;areas.push({id:Math.max(...areas.map(x=>x.id))+1,name:v,standard:'no'});dlg.innerHTML='';draw();return}
});
document.addEventListener('change',e=>{if(e.target.id==='photoInput'){const f=e.target.files?.[0];if(f){const note=document.getElementById('newNote')?.value||'',ar=document.getElementById('newArea')?.value||'';const rd=new FileReader();rd.onload=()=>{upload=String(rd.result);draw();document.getElementById('newNote').value=note;document.getElementById('newArea').value=ar};rd.readAsDataURL(f)}}});
document.addEventListener('dragstart',e=>{const s=e.target.closest('[data-id]');if(!s)return;drag=Number(s.dataset.id);e.dataTransfer?.setData('text/plain',String(drag))});
document.addEventListener('dragover',e=>{const lane=e.target.closest('[data-group]');if(lane){e.preventDefault();lane.classList.add('hover')}});
document.addEventListener('dragleave',e=>{const lane=e.target.closest('[data-group]');if(lane)lane.classList.remove('hover')});
document.addEventListener('drop',e=>{const lane=e.target.closest('[data-group]');if(!lane)return;e.preventDefault();let n=notes.find(x=>x.id===drag);if(n){const g=boardGroups[Number(lane.dataset.group)];if(g&&!g.types.includes(n.cat))n.cat=g.defaultCat}drag=null;draw()});
document.addEventListener('dragend',()=>{drag=null;document.querySelectorAll('.lane').forEach(x=>x.classList.remove('hover'))});
draw();
})();
</script></body></html>

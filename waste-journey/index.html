function standardDecision(id){const n=notes.find(x=>x.id===id);if(!n)return;const opts=['Not reviewed','Standard adequate','Missing standard','Improve standard','Not followed','Needs further investigation'];dlg.innerHTML='<div class="overlay"><div class="dialog"><div class="row between"><h2>Standard review · #'+n.id+'</h2>'+B('✕','close')+'</div><p><b>'+E(n.title)+'</b></p><p>Context: '+E(contextName(n))+'</p><label class="label">What did the observation reveal?</label><select id="standardDecisionSelect">'+opts.map(v=>'<option '+((n.standardDecision||'Not reviewed')===v?'selected':'')+'>'+E(v)+'</option>').join('')+'</select><div class="hint">Choose whether to create a corrective task, improve a standard, or keep investigating. This records a finding only. It does not create a task, publish a standard, complete an action or verify improvement. Not followed means noncompliance requiring follow-up, not closure; Standard adequate is not automatic closure.</div><div class="row wrap">'+B('Save decision','saveStandard:'+n.id,'primary')+B('Open observation','edit:'+n.id)+'</div></div></div>'}
function draw(){workspace.className='workspace '+page;document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===page));({capture,review,board,areas:areasPage})[page]();if(page==='capture'||page==='review'){workspace.insertAdjacentHTML('beforeend','<nav class="device-nav" aria-label="Mobile workflow navigation"><button type="button" data-page="capture" class="'+(page==='capture'?'selected':'')+'"><i class="bi bi-camera" aria-hidden="true"></i> Capture</button><button type="button" data-page="review" class="'+(page==='review'?'selected':'')+'"><i class="bi bi-clipboard-check" aria-hidden="true"></i> Review</button></nav>')}}
function edit(id){let n=notes.find(n=>n.id===id);if(!n)return;const media=n.photos?'<div class="observation-media"><div class="row between"><b>Photos</b>'+photoBadge(n)+'</div><button type="button" class="media-preview" data-act="zoom:'+id+'" aria-label="View observation photo larger"><img src="'+E(img(n))+'" alt="Photo attached to observation #'+n.id+'" onerror="this.style.display=\'none\';this.parentElement.insertAdjacentHTML(\'beforeend\',\'<span class=media-error>Photo unavailable</span>\')"></button>'+(n.photos>1?'<p class="micro">Sample data indicates '+n.photos+' photos; only one illustrative image is available in this prototype.</p>':'')+'</div>':'';dlg.innerHTML='<div class="overlay"><div class="dialog" role="dialog" aria-modal="true" aria-label="Edit observation"><div class="row between"><h2>Observation #'+n.id+'</h2>'+B('✕','close')+'</div>'+media+'<label class="label">Description</label><textarea id="etitle">'+E(n.title)+'</textarea><label class="label">Waste category</label><select id="ecat">'+catOptions(n.cat)+'</select><label class="label">Area · optional</label><select id="earea">'+areaOptions(n.area)+'</select><label class="label">Process · optional</label><select id="eprocess">'+processOptions(n.process)+'</select><p class="micro">Submitted by '+E(n.author)+' · '+E(n.channel)+'</p>'+statusBadge(n)+taskSummary(n)+'<div class="row wrap dialog-actions" style="margin-top:12px">'+B('Delete observation','delete:'+id)+B('Cancel','close')+B('Save changes','saveedit:'+id,'primary')+'</div></div></div>'}
function areaEdit(id){const a=A(id);if(!a)return;dlg.innerHTML='<div class="overlay"><div class="dialog"><div class="row between"><h2>Edit area</h2>'+B('✕','close')+'</div><label class="label">Area</label><input id="aname" value="'+E(a.name)+'"><label class="label">Standard coverage (demo)</label><select id="astatus">'+standardOptions(a.standard)+'</select>'+B('Save area','savearea:'+id,'primary wide')+'</div></div>'}
document.addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b){if(dlg.querySelector('.overlay'))return;stopCamera();page=b.dataset.page;draw();window.scrollTo({top:0,behavior:'auto'});return}b=e.target.closest('[data-act]');if(!b)return;let [act,raw]=b.dataset.act.split(':'),id=Number(raw),n=notes.find(x=>x.id===id);
if(['capture','review','board','areas'].includes(act)){stopCamera();page=act;draw();return}
if(act==='openCamera'){openCamera();return}
if(act==='snapCamera'){snapCamera();return}
if(act==='closeCamera'){closeDialog();return}
if(act==='close'){closeDialog();return}
if(act==='edit'){edit(id);return}
if(act==='decision'){decisionModal(id);return}
if(act==='saveDecision'&&n&&reviewRole==='reviewer'){const status=document.getElementById('reviewStatus').value,reason=document.getElementById('reviewReason').value.trim();if(status==='Rejected'&&!reason){alert('A rejection reason is required.');return}n.reviewStatus=status;n.reviewReason=reason;n.reviewer='Lean review team';closeDialog();draw();return}
if(act==='reviewfilter'){reviewFilter=raw;draw();return}
if(act==='role'){reviewRole=raw;draw();return}
if(act==='mode'){captureMode=raw;upload=null;draw();return}
if(act==='groupSelected'){const ids=[...selectedIds].filter(id=>notes.some(n=>n.id===id));if(ids.length<2){alert('Select at least two observations.');return}const p={id:nextProblemId++,ids};problems.push(p);ids.forEach(id=>notes.find(n=>n.id===id).problemId=p.id);selectedIds.clear();draw();return}
if(act==='clearSelected'){selectedIds.clear();draw();return}
if(act==='sharedTask'){const ids=[...selectedIds];if(!ids.length){alert('Select observations first.');return}const t=newTask(ids);selectedIds.clear();draw();if(t)taskModal(t);return}
if(act==='newTask'&&n){const ids=n.problemId?problems.find(p=>p.id===n.problemId)?.ids:[n.id];const t=newTask(ids||[n.id]);draw();if(t)taskModal(t);return}
if(act==='taskdetail'){const t=demoTasks.find(x=>x.id===id);if(t)taskModal(t);return}
if(act==='saveTask'){const t=demoTasks.find(x=>x.id===id);if(!t)return;t.owner=document.getElementById('taskOwner').value.trim()||'Unassigned';t.due=document.getElementById('taskDue').value.trim()||'Not set';t.status=document.getElementById('taskStatus').value;closeDialog();draw();return}
if(act==='delete'&&n){dlg.innerHTML='<div class="overlay"><div class="dialog" role="alertdialog" aria-modal="true" aria-label="Delete observation"><h2>Delete observation #'+n.id+'?</h2><p>This will remove the observation from this demo and update all views.</p><div class="row wrap dialog-actions">'+B('Cancel','edit:'+id)+B('Yes, delete','confirmdelete:'+id,'primary')+'</div></div></div>';return}
if(act==='confirmdelete'&&n){notes=notes.filter(x=>x.id!==id);closeDialog();draw();return}
if(act==='zoom'&&n){const image=img(n);window.open(image,'_blank','noopener,noreferrer');return}
if(act==='standard'){standardDecision(id);return}
if(act==='saveStandard'&&n){n.standardDecision=document.getElementById('standardDecisionSelect').value;dlg.innerHTML='';draw();return}
if(act==='area'){areaEdit(id);return}
if(act==='save'){const title=document.getElementById('newNote').value.trim()||'New observation',ar=document.getElementById('newArea').value,cat=document.getElementById('newCategory').value,author=captureMode==='qr'?document.getElementById('qrName').value.trim():'Demo Operator';if(!author){alert('Please enter your name.');return}notes.unshift({id:nextId++,title,area:ar?Number(ar):null,cat,photos:upload?1:0,imageData:upload,img:null,tasks:0,draft:false,author,channel:captureMode==='qr'?'QR demo':'Account',created:'29 Oct 2026',reviewStatus:'Pending review',reviewReason:'',reviewer:'',problemId:null});upload=null;draw();return}
if(act==='task'&&n){n.tasks++;dlg.innerHTML='';draw();return}
if(act==='draft'&&n){const ar=document.getElementById('earea').value;if(!ar){alert('Select a real target area before creating a draft.');return}n.area=Number(ar);n.draft=true;dlg.innerHTML='';draw();return}
if(act==='saveedit'&&n){n.title=document.getElementById('etitle').value.trim()||n.title;n.cat=document.getElementById('ecat').value;const a=document.getElementById('earea').value;n.area=a?Number(a):null;const p=document.getElementById('eprocess').value;n.process=p?Number(p):null;dlg.innerHTML='';draw();return}
if(act==='savearea'){const a=A(id);a.name=document.getElementById('aname').value.trim()||a.name;a.standard=document.getElementById('astatus').value;dlg.innerHTML='';draw();return}
if(act==='filter'){if(page!=='board')return;boardFilter=boardFilter===raw&&raw!=='all'?'all':raw;draw();return}
if(act==='newprocess'){dlg.innerHTML='<div class="overlay"><div class="dialog" role="dialog" aria-modal="true" aria-label="Define process"><div class="row between"><h2>Define process</h2>'+B('✕','close')+'</div><label class="label">Process name</label><input id="newProcessName" placeholder="e.g. Material replenishment"><label class="label">Standard coverage</label><select id="newProcessStatus">'+standardOptions('review')+'</select><div class="row wrap dialog-actions">'+B('Cancel','close')+B('Create process','createprocess','primary')+'</div></div></div>';return}
if(act==='createprocess'){const v=document.getElementById('newProcessName').value.trim();if(!v)return;processes.push({id:Math.max(0,...processes.map(x=>x.id))+1,name:v,standard:document.getElementById('newProcessStatus').value});closeDialog();draw();return}
if(act==='process'&&P(id)){const p=P(id);dlg.innerHTML='<div class="overlay"><div class="dialog" role="dialog" aria-modal="true" aria-label="Edit process"><div class="row between"><h2>Edit process</h2>'+B('✕','close')+'</div><label class="label">Name</label><input id="processName" value="'+E(p.name)+'"><label class="label">Standard coverage</label><select id="processStatus">'+standardOptions(p.standard)+'</select><div class="row wrap dialog-actions">'+B('Cancel','close')+B('Save process','saveprocess:'+id,'primary')+'</div></div></div>';return}
if(act==='saveprocess'&&P(id)){const p=P(id);p.name=document.getElementById('processName').value.trim()||p.name;p.standard=document.getElementById('processStatus').value;closeDialog();draw();return}
if(act==='newarea'){dlg.innerHTML='<div class="overlay"><div class="dialog" role="dialog" aria-modal="true" aria-label="Define area"><div class="row between"><h2>Define area</h2>'+B('✕','close')+'</div><label class="label">Area name</label><input id="newAreaName" placeholder="e.g. Line 2 buffer"><label class="label">Standard coverage</label><select id="newAreaStatus">'+standardOptions('review')+'</select>'+'<div class="row wrap dialog-actions">'+B('Cancel','close')+B('Create area','createarea','primary')+'</div></div></div>';return}
if(act==='createarea'){const v=document.getElementById('newAreaName').value.trim();if(!v)return;areas.push({id:Math.max(...areas.map(x=>x.id))+1,name:v,standard:document.getElementById('newAreaStatus').value});closeDialog();draw();return}
});
document.addEventListener('change',e=>{if(e.target.id==='photoInput'){const f=e.target.files?.[0];if(f){const note=document.getElementById('newNote')?.value||'',ar=document.getElementById('newArea')?.value||'',cat=document.getElementById('newCategory')?.value||'Unclassified',qr=document.getElementById('qrName')?.value||'';const rd=new FileReader();rd.onload=()=>{upload=String(rd.result);draw();document.getElementById('newNote').value=note;document.getElementById('newArea').value=ar;document.getElementById('newCategory').value=cat;if(document.getElementById('qrName'))document.getElementById('qrName').value=qr};rd.readAsDataURL(f)}}});
document.addEventListener('change',e=>{if(e.target.matches('[data-select-id]')){const id=Number(e.target.dataset.selectId);if(e.target.checked)selectedIds.add(id);else selectedIds.delete(id)}});
document.addEventListener('dragstart',e=>{const s=e.target.closest('[data-id]');if(!s)return;drag=Number(s.dataset.id);e.dataTransfer?.setData('text/plain',String(drag))});
document.addEventListener('dragover',e=>{const lane=e.target.closest('[data-group]');if(lane){e.preventDefault();lane.classList.add('hover')}});
document.addEventListener('dragleave',e=>{const lane=e.target.closest('[data-group]');if(lane)lane.classList.remove('hover')});
document.addEventListener('drop',e=>{const lane=e.target.closest('[data-group]');if(!lane)return;e.preventDefault();let n=notes.find(x=>x.id===drag);if(n){const g=boardGroups[Number(lane.dataset.group)];if(g&&!g.types.includes(n.cat))n.cat=g.defaultCat}drag=null;draw()});
document.addEventListener('dragend',()=>{drag=null;document.querySelectorAll('.lane').forEach(x=>x.classList.remove('hover'))});
draw();
})();
</script></body></html>
